<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="60%" stop-color="#EE0033" />
      <stop offset="100%" stop-color="#C70025" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Bleed Background (No rounded corners so OS masks work cleanly) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle geometric radial highlight -->
  <circle cx="256" cy="230" r="190" fill="white" opacity="0.05" />

  <!-- Logo Group centered inside 80% Safe Zone (380x380 px) -->
  <g transform="translate(0, 15)" filter="url(#glow)">
    <!-- Telecommunication / Wifi / Fiber Wave Rings -->
    <path d="M 180 148 A 96 96 0 0 1 332 148" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.95" />
    <path d="M 212 180 A 54 54 0 0 1 300 180" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95" />
    <circle cx="256" cy="208" r="12" fill="#FFFFFF" />

    <!-- Wordmark: viettel -->
    <text x="256" y="305" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif" 
          font-size="86" 
          font-weight="900" 
          letter-spacing="-2" 
          fill="#FFFFFF" 
          text-anchor="middle">
      viettel
    </text>

    <!-- Subtitle: TELECOM -->
    <text x="256" y="346" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="8" 
          fill="#FFE4E8" 
          text-anchor="middle">
      TELECOM
    </text>

    <!-- Fiber & 5G Service Badge -->
    <g transform="translate(256, 386)">
      <rect x="-76" y="-14" width="152" height="28" rx="14" fill="#FFFFFF" opacity="0.22" />
      <text x="0" y="5" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" 
            font-size="12" 
            font-weight="900" 
            letter-spacing="2" 
            fill="#FFFFFF" 
            text-anchor="middle">
        WIFI 6 • 5G • FTTH
      </text>
    </g>
  </g>
</svg>